services:
  - type: web
    name: news-scraper
    runtime: docker
    repo: https://github.com/AshayaSah/fifty-shades-of-agent
    branch: refactor/fastapi-mcp-migrate
    dockerfilePath: news-scraper/Dockerfile
    dockerContext: news-scraper
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: MCP_API_TOKEN
        sync: false

  - type: web
    name: technical-analyst
    runtime: docker
    repo: https://github.com/AshayaSah/fifty-shades-of-agent
    branch: refactor/fastapi-mcp-migrate
    dockerfilePath: technical-analyst/Dockerfile
    dockerContext: technical-analyst
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: MCP_API_TOKEN
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: LOG_LEVEL
        value: INFO