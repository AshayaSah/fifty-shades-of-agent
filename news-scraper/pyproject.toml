[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "fastmcp>=3.4.7,<4.0.0",
    "feedparser>=6.0.14",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "spacy>=3.8.16",
    "torch>=2.13.0",
    "trafilatura>=2.2.0",
    "transformers>=5.15.1",
    "uvicorn>=0.30",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/news_scraper"]
