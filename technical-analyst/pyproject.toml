[project]
name = "technical-analyst"
version = "0.1.0"
description = "Technical analysis MCP server for the fifty-shades-of-agent project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "fastmcp>=3.4.7,<4.0.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pandas-ta>=0.3.14b0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "yfinance>=0.2.40",
    "mcp[cli]>=1.29.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
