# Development environment
#   - Builds each service from its own service-local Dockerfile (dev target)
#   - Mounts source as a volume for hot-reload
#   - Boots a local Postgres for development (override with DATABASE_URL if using Neon)
#
# Usage:
#   docker compose up --build
#   docker compose up --build news-scraper          # run a single service
#   docker compose down -v                          # tear down + drop the DB volume

services:
  db:
    image: postgres:16-alpine
    container_name: fsoa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fifty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fifty}
      POSTGRES_DB: ${POSTGRES_DB:-fifty}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fifty}"]
      interval: 5s
      timeout: 5s
      retries: 10

  news-scraper:
    build:
      context: ./news-scraper
      target: dev
    container_name: fsoa-news-scraper
    env_file:
      - news-scraper/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fifty}:${POSTGRES_PASSWORD:-fifty}@db:5432/${POSTGRES_DB:-fifty}
    volumes:
      - ./news-scraper:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  technical-analyst:
    build:
      context: ./technical-analyst
      target: dev
    container_name: fsoa-technical-analyst
    env_file:
      - technical-analyst/.env
    environment:
      NEON_DATABASE_URL: postgresql://${POSTGRES_USER:-fifty}:${POSTGRES_PASSWORD:-fifty}@db:5432/${POSTGRES_DB:-fifty}?sslmode=disable
    volumes:
      - ./technical-analyst:/app
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  # Wine + MetaTrader 5 sidecar. The trader's `mt5linux` bridge connects here
  # over RPyC (port 18812). noVNC (port 8080) is exposed so you can watch the
  # terminal in a browser. The container auto-logs into MT5 when the
  # MT5_LOGIN / MT5_PASSWORD / MT5_SERVER env vars are set.
  mt5-sidecar:
    image: lprett/mt5linux:mt5-installed
    container_name: fsoa-mt5-sidecar
    environment:
      MT5_LOGIN: ${EXNESS_LOGIN:-}
      MT5_PASSWORD: ${EXNESS_PASSWORD:-}
      MT5_SERVER: ${EXNESS_SERVER:-}
      VNC_PASSWORD: ${VNC_PASSWORD:-fifty}
    ports:
      - "${MT5_RPYC_PORT:-18812}:18812"
      - "${MT5_NOVNC_PORT:-8080}:8080"
      - "${MT5_VNC_PORT:-5901}:5901"

  trader:
    build:
      context: ./trader
      target: dev
    container_name: fsoa-trader
    env_file:
      - trader/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fifty}:${POSTGRES_PASSWORD:-fifty}@db:5432/${POSTGRES_DB:-fifty}
      EXNESS_LOGIN: ${EXNESS_LOGIN:-}
      EXNESS_PASSWORD: ${EXNESS_PASSWORD:-}
      EXNESS_SERVER: ${EXNESS_SERVER:-}
      MT5_HOST: mt5-sidecar
      MT5_PORT: "18812"
      MT5_CONNECT_TIMEOUT: "300"
    volumes:
      - ./trader:/app
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
      mt5-sidecar:
        condition: service_started

volumes:
  pgdata:
