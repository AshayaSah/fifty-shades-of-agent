# Production environment
#   - Builds each service from its own service-local Dockerfile (prod target)
#   - No source volume mounts, no local Postgres (bring your own database)
#   - Services are published on different host ports so they can be reached
#     independently (e.g. by a coordinating agent / MCP client)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Values can be overridden via a .env.prod file, e.g.:
#   NEWS_DATABASE_URL=postgresql://user:pass@host:5432/news?sslmode=require
#   EXNESS_LOGIN=...
#   etc.

services:
  news-scraper:
    build:
      context: ./news-scraper
      target: prod
    image: fifty-shades-of-agent/news-scraper:prod
    container_name: fsoa-news-scraper-prod
    restart: unless-stopped
    env_file:
      - news-scraper/.env
    environment:
      DATABASE_URL: ${NEWS_DATABASE_URL:?set NEWS_DATABASE_URL}
    ports:
      - "${NEWS_PORT:-8001}:8000"

  technical-analyst:
    build:
      context: ./technical-analyst
      target: prod
    image: fifty-shades-of-agent/technical-analyst:prod
    container_name: fsoa-technical-analyst-prod
    restart: unless-stopped
    env_file:
      - technical-analyst/.env
    environment:
      NEON_DATABASE_URL: ${ANALYST_DATABASE_URL:?set ANALYST_DATABASE_URL}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    ports:
      - "${ANALYST_PORT:-8002}:8000"

  # Wine + MetaTrader 5 sidecar for the trader's `mt5linux` bridge (Linux
  # deployments). Exposes the RPyC server (18812) and a noVNC view (8080).
  mt5-sidecar:
    image: lprett/mt5linux:mt5-installed
    container_name: fsoa-mt5-sidecar-prod
    restart: unless-stopped
    environment:
      MT5_LOGIN: ${EXNESS_LOGIN:-}
      MT5_PASSWORD: ${EXNESS_PASSWORD:-}
      MT5_SERVER: ${EXNESS_SERVER:-}
      VNC_PASSWORD: ${VNC_PASSWORD:-fifty}
    ports:
      - "${MT5_RPYC_PORT:-18812}:18812"
      - "${MT5_NOVNC_PORT:-8080}:8080"

  trader:
    build:
      context: ./trader
      target: prod
    image: fifty-shades-of-agent/trader:prod
    container_name: fsoa-trader-prod
    restart: unless-stopped
    env_file:
      - trader/.env
    environment:
      DATABASE_URL: ${TRADER_DATABASE_URL:?set TRADER_DATABASE_URL}
      EXNESS_LOGIN: ${EXNESS_LOGIN:-}
      EXNESS_PASSWORD: ${EXNESS_PASSWORD:-}
      EXNESS_SERVER: ${EXNESS_SERVER:-}
      MT5_HOST: mt5-sidecar
      MT5_PORT: "18812"
      MT5_CONNECT_TIMEOUT: "300"
    ports:
      - "${TRADER_PORT:-8003}:8000"
    depends_on:
      mt5-sidecar:
        condition: service_started
